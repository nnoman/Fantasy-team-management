name: tests

# Runs against a fresh checkout with no database, so the integration tests that
# need a snapshot skip themselves rather than fail. The unit tests — scoring
# maths, shrinkage, the minutes model — carry the load here.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/ -v --tb=short
