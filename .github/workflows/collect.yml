name: pipeline

# The scheduled run: snapshot, project, record predictions, score the last
# gameweek. All four steps share one restored copy of the database and it is
# saved once at the end.
#
# Deliberately a single job rather than four workflows. The database lives in
# the Actions cache, and separate workflows would each restore, append and save
# their own copy — whichever finished last would silently overwrite the others.
# Sequential steps in one job cannot race.
on:
  schedule:
    - cron: "15 2 * * *"     # 02:15 UTC daily — after overnight price changes
    - cron: "45 22 * * *"    # 22:45 UTC daily — before the next price deadline
    - cron: "15 3 * * 1"     # 03:15 UTC Mondays — plus the weekly history refresh
  workflow_dispatch:
    inputs:
      enrich:
        description: "Also refresh per-season player history (~10 minutes)"
        type: boolean
        default: false

# contents:read is all the pipeline itself needs; pages+id-token are for the
# deploy job below, which publishes the dashboard.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

# Steps below pipe into tee to reach the job summary. GitHub's default run shell
# is `bash -e` WITHOUT pipefail, so the exit code of a pipeline is tee's, not the
# command's -- a failed collect would report a green run. Naming the shell
# explicitly gets `bash -eo pipefail`, which is the whole point.
defaults:
  run:
    shell: bash

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database is the asset. Restore it, append to it, save it back.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/fpl.sqlite3
          key: fpl-db-${{ github.run_id }}
          restore-keys: fpl-db-

      - name: Collect snapshot
        env:
          FPL_ENTRY_ID: 6643465
          # Optional. Without it the snapshot still runs — every field the
          # projection model reads is public — but the auth health check is
          # skipped. Cookies are not credentials for this API; the bearer token
          # is. See README "Authentication: what actually works".
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
        run: python -m fpl.collect | tee -a "$GITHUB_STEP_SUMMARY"

      # Completed seasons do not change, so this runs weekly rather than nightly:
      # it is ~620 requests at one per second.
      - name: Refresh player history
        if: github.event.schedule == '15 3 * * 1' || inputs.enrich
        run: python -m fpl.enrich

      # Records what the model expects before the gameweek is played. This
      # cannot be back-filled — without a forecast on file there is nothing to
      # score the model against later.
      - name: Project and record predictions
        run: |
          {
            echo '## Advisory report'
            echo '```'
            python -m fpl.advise --shortlist
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Self-guarding: refuses to score a gameweek FPL has not marked finished,
      # because event/{gw}/live/ serves the previous season's results until then.
      - name: Score the last finished gameweek
        continue-on-error: true
        run: |
          {
            echo '## Reconciliation'
            echo '```'
            python -m fpl.reconcile || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Fails the run if the database is stale, empty or missing history, so a
      # pipeline that silently stopped producing usable data shows up red rather
      # than green-with-nothing-in-it.
      - name: Health check
        run: |
          {
            echo '## Health'
            echo '```'
            python -m fpl.status
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A static page, generated from the database that was just updated, so the
      # squad and the pipeline's health are readable from any browser without a
      # GitHub login or a Python install.
      - name: Build dashboard
        run: python -m fpl.dashboard --out site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Save database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/fpl.sqlite3
          key: fpl-db-${{ github.run_id }}

      # A durable copy, so a cache eviction never loses the season's history.
      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpl-db
          path: data/fpl.sqlite3
          retention-days: 90

  # Separate job because actions/deploy-pages needs its own `environment`, which
  # is job-level. It runs only after the pipeline has produced a fresh page.
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
